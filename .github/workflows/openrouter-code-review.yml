# Organization-required OpenRouter PR review.
# Enforced via org ruleset "Require OpenRouter code review" pointing at this
# file, so every pegma-dev repository (including new ones) gets it without a
# per-repo workflow. Auth: org-level OPENROUTER_API_KEY secret only.
#
# Two cheap review lanes run in parallel and the pinned judge union-merges
# their findings into one review:
#   meta/muse-spark-1.2   (Meta Muse Spark 1.2)
#   z-ai/glm-5.3-flash    (Z.ai GLM 5.3 Flash)
#   judge: openai/gpt-5.6-luna
#
# Scope selection: a run reviews the full PR (50 read-only tool rounds)
# unless this PR already carries a review ledger posted by the bot, in which
# case a synchronize run reviews only the unreviewed commit range (30
# rounds). The ledger check, not the event type, decides: the action refuses
# a latest-commit round with no ledger, and GitHub can discard a still-queued
# first pass when a newer run enters the same concurrency group, so deriving
# scope from the event alone would strand a PR without an initial review.
#
# One concurrency group per PR with cancel-in-progress off, so runs for the
# same PR execute one at a time and each sees the ledger the previous one
# wrote. GitHub keeps only the newest pending run per group; with ledger-
# based scope selection the survivor always does the right thing.
#
# The job always runs and only the review steps are gated, so the required
# check stays green for events that cannot be reviewed: ruleset-triggered
# runs ignore the `types:` filter below and fire only on opened, synchronize,
# and reopened; fork and Dependabot PRs never receive the org secret; drafts
# are reviewed like any other PR because ready_for_review never arrives from
# the ruleset. A missing org secret warns and skips. What can still turn the
# check red: the job timeout, a checkout failure, or the action itself
# failing (for example every lane and retry failing during an OpenRouter
# outage). Those are accepted; organization admins bypass the ruleset, and
# fail_on stays "never" so review findings are never a merge gate.
name: OpenRouter code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Optional manual re-run from the Actions tab on a PR's head repo
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: openrouter-code-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    name: OpenRouter review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OR_MODELS: meta/muse-spark-1.2,z-ai/glm-5.3-flash
      OR_JUDGE: openai/gpt-5.6-luna
      # Must match the posting identity (github.token posts as github-actions[bot]).
      BOT_LOGIN: github-actions[bot]
      # Hidden marker the action embeds in every review body that carries loop state.
      LEDGER_MARKER: "<!-- openrouter-review-ledger:v1:"
      # Eligible: a manual dispatch, or a same-repo pull_request event of a
      # reviewable type from anyone but Dependabot. Fork PRs have no org
      # secret and no write token; Dependabot runs get Dependabot secrets.
      REVIEW_ELIGIBLE: >-
        ${{
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'pull_request' &&
            contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]' &&
            github.actor != 'dependabot[bot]')) && 'true' || 'false'
        }}
    steps:
      - name: Skip ineligible event
        if: env.REVIEW_ELIGIBLE != 'true'
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
        run: echo "::notice::OpenRouter review skipped for ${EVENT}/${ACTION} (fork, Dependabot, or non-review activity)."

      - name: Check OPENROUTER_API_KEY
        if: env.REVIEW_ELIGIBLE == 'true'
        id: key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::warning::OPENROUTER_API_KEY is empty; review skipped. Set the org-level OPENROUTER_API_KEY secret with visibility to this repository."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve PR head and review scope
        if: env.REVIEW_ELIGIBLE == 'true' && steps.key.outputs.present == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          if [[ ! "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive integer, got '${PR_NUMBER}'."
            exit 1
          fi
          SHA="${EVENT_HEAD_SHA:-}"
          if [ -z "$SHA" ]; then
            SHA="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          fi
          if [[ ! "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Could not resolve a full head SHA for PR ${PR_NUMBER}."
            exit 1
          fi
          # A synchronize run may only narrow to the latest commits when the
          # bot has already posted loop state on this PR; otherwise it is the
          # initial full-PR review regardless of the event that started it.
          SCOPE=full-pr
          TURNS=50
          if [ "${EVENT_ACTION}" = "synchronize" ]; then
            # jq reads BOT_LOGIN and LEDGER_MARKER from the environment.
            LEDGERS="$(gh api --paginate "repos/${GH_REPO}/pulls/${PR_NUMBER}/reviews" \
              --jq '[.[] | select(.user.login == env.BOT_LOGIN) | .body // "" | select(contains(env.LEDGER_MARKER))] | length' \
              | awk '{s+=$1} END {print s+0}')"
            if [ "${LEDGERS}" -gt 0 ]; then
              SCOPE=latest-commit
              TURNS=30
            else
              echo "::notice::No prior review ledger on PR ${PR_NUMBER}; running the initial full-PR review."
            fi
          fi
          {
            echo "head_sha=${SHA,,}"
            echo "number=${PR_NUMBER}"
            echo "scope=${SCOPE}"
            echo "turns=${TURNS}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        if: env.REVIEW_ELIGIBLE == 'true' && steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.pr.outputs.head_sha }}

      - name: Run OpenRouter review
        if: env.REVIEW_ELIGIBLE == 'true' && steps.key.outputs.present == 'true'
        id: review
        uses: FlyOverCoderKY/openrouter-pr-review-action@4471f5963751223c26a2e169d78c0f13817165aa # main 2026-09-09
        with:
          github_token: ${{ github.token }}
          pr_number: ${{ steps.pr.outputs.number }}
          bot_login: ${{ env.BOT_LOGIN }}
          models: ${{ env.OR_MODELS }}
          judge_model: ${{ env.OR_JUDGE }}
          review_scope: ${{ steps.pr.outputs.scope }}
          review_mode: auto
          fail_on: never
          roast_level: professional
          status_comments: "true"
          max_tool_turns: ${{ steps.pr.outputs.turns }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Summary
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          KEY_PRESENT: ${{ steps.key.outputs.present }}
          SCOPE: ${{ steps.pr.outputs.scope }}
          VERDICT: ${{ steps.review.outputs.verdict }}
          ISSUES: ${{ steps.review.outputs.issue_count }}
          REVIEW_URL: ${{ steps.review.outputs.review_url }}
        run: |
          {
            echo "### OpenRouter code review"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Event | \`${EVENT}/${ACTION:-dispatch}\` |"
            echo "| Eligible | \`${REVIEW_ELIGIBLE}\` |"
            echo "| Secret present | \`${KEY_PRESENT:-n/a}\` |"
            echo "| Scope | \`${SCOPE:-n/a}\` |"
            echo "| Models | \`${OR_MODELS}\` |"
            echo "| Judge | \`${OR_JUDGE}\` |"
            echo "| Verdict | \`${VERDICT:-n/a}\` |"
            echo "| Issues | \`${ISSUES:-n/a}\` |"
            echo "| Review | ${REVIEW_URL:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"
