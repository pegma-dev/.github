# Organization-required OpenRouter PR review.
# Enforced via org ruleset "Require OpenRouter code review" pointing at this
# file, so every pegma-dev repository (including new ones) gets it without a
# per-repo workflow. Auth: org-level OPENROUTER_API_KEY secret only.
#
# Two cheap review lanes run in parallel and the pinned judge union-merges
# their findings into one review:
#   meta/muse-spark-1.2   (Meta Muse Spark 1.2)
#   z-ai/glm-5.3-flash    (Z.ai GLM 5.3 Flash)
#   judge: openai/gpt-5.6-luna
#
# First pass (opened, reopened, ready_for_review, workflow_dispatch): full-PR
# review, 50 read-only tool rounds. Follow-up (synchronize): latest-commit
# round against the existing ledger, 30 tool rounds.
#
# The job always runs and only the review steps are gated, so the required
# check stays green for events that cannot be reviewed. A missing org secret
# warns and skips rather than failing; a reviewer outage must not block every
# merge in the organization. The only hard failures are a malformed
# pr_number or an unresolvable PR head, which can only happen on a manual
# dispatch and therefore never touch a pull request's required check.
# Ruleset-triggered runs ignore the `types:` filter below and fire only on
# the default activity types (opened, synchronize, reopened), and fork /
# Dependabot PRs never receive the org secret, so a job-level skip or a hard
# failure in those cases would leave the required check unsatisfied or red.
# Drafts are reviewed like any other PR: the ruleset never sends
# ready_for_review, and a latest-commit follow-up is refused when no initial
# review exists, so skipping drafts would strand them. fail_on stays "never":
# this is a reviewer, not a merge gate; the ruleset only requires the
# workflow to complete.
#
# One concurrency group per PR with cancel-in-progress off: a synchronize
# that lands while the first pass is still running waits for it instead of
# starting a follow-up that would be refused for lack of a ledger. GitHub
# keeps only the newest pending run per group, and a latest-commit follow-up
# reviews the whole unreviewed range, so superseded pending runs lose nothing.
name: OpenRouter code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Optional manual re-run from the Actions tab on a PR's head repo
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: openrouter-code-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    name: OpenRouter review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OR_MODELS: meta/muse-spark-1.2,z-ai/glm-5.3-flash
      OR_JUDGE: openai/gpt-5.6-luna
      IS_FOLLOW_UP: ${{ (github.event_name == 'pull_request' && github.event.action == 'synchronize') && 'true' || 'false' }}
      # Eligible: a manual dispatch, or a same-repo pull_request event of a
      # reviewable type from anyone but Dependabot. Fork PRs have no org
      # secret and no write token; Dependabot runs get Dependabot secrets.
      REVIEW_ELIGIBLE: >-
        ${{
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'pull_request' &&
            contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]' &&
            github.actor != 'dependabot[bot]')) && 'true' || 'false'
        }}
    steps:
      - name: Skip ineligible event
        if: env.REVIEW_ELIGIBLE != 'true'
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
        run: echo "::notice::OpenRouter review skipped for ${EVENT}/${ACTION} (fork, Dependabot, or non-review activity)."

      - name: Check OPENROUTER_API_KEY
        if: env.REVIEW_ELIGIBLE == 'true'
        id: key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::warning::OPENROUTER_API_KEY is empty; review skipped. Set the org-level OPENROUTER_API_KEY secret with visibility to this repository."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve PR head
        if: env.REVIEW_ELIGIBLE == 'true' && steps.key.outputs.present == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          if [[ ! "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive integer, got '${PR_NUMBER}'."
            exit 1
          fi
          SHA="${EVENT_HEAD_SHA:-}"
          if [ -z "$SHA" ]; then
            SHA="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          fi
          if [[ ! "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Could not resolve a full head SHA for PR ${PR_NUMBER}."
            exit 1
          fi
          echo "head_sha=${SHA,,}" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        if: env.REVIEW_ELIGIBLE == 'true' && steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.pr.outputs.head_sha }}

      - name: Run OpenRouter review (first pass)
        if: env.REVIEW_ELIGIBLE == 'true' && steps.key.outputs.present == 'true' && env.IS_FOLLOW_UP != 'true'
        id: first
        uses: FlyOverCoderKY/openrouter-pr-review-action@4471f5963751223c26a2e169d78c0f13817165aa # main 2026-09-09
        with:
          github_token: ${{ github.token }}
          pr_number: ${{ steps.pr.outputs.number }}
          models: ${{ env.OR_MODELS }}
          judge_model: ${{ env.OR_JUDGE }}
          review_scope: full-pr
          review_mode: auto
          fail_on: never
          roast_level: professional
          status_comments: "true"
          max_tool_turns: "50"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Run OpenRouter review (follow-up)
        if: env.REVIEW_ELIGIBLE == 'true' && steps.key.outputs.present == 'true' && env.IS_FOLLOW_UP == 'true'
        id: follow
        uses: FlyOverCoderKY/openrouter-pr-review-action@4471f5963751223c26a2e169d78c0f13817165aa # main 2026-09-09
        with:
          github_token: ${{ github.token }}
          pr_number: ${{ steps.pr.outputs.number }}
          models: ${{ env.OR_MODELS }}
          judge_model: ${{ env.OR_JUDGE }}
          review_scope: latest-commit
          review_mode: auto
          fail_on: never
          roast_level: professional
          status_comments: "true"
          max_tool_turns: "30"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Summary
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          KEY_PRESENT: ${{ steps.key.outputs.present }}
          VERDICT: ${{ steps.first.outputs.verdict || steps.follow.outputs.verdict }}
          ISSUES: ${{ steps.first.outputs.issue_count || steps.follow.outputs.issue_count }}
          REVIEW_URL: ${{ steps.first.outputs.review_url || steps.follow.outputs.review_url }}
        run: |
          {
            echo "### OpenRouter code review"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Event | \`${EVENT}/${ACTION:-dispatch}\` |"
            echo "| Eligible | \`${REVIEW_ELIGIBLE}\` |"
            echo "| Secret present | \`${KEY_PRESENT:-n/a}\` |"
            echo "| Pass | \`$([ "${IS_FOLLOW_UP}" = true ] && echo follow-up || echo first-pass)\` |"
            echo "| Models | \`${OR_MODELS}\` |"
            echo "| Judge | \`${OR_JUDGE}\` |"
            echo "| Verdict | \`${VERDICT:-n/a}\` |"
            echo "| Issues | \`${ISSUES:-n/a}\` |"
            echo "| Review | ${REVIEW_URL:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"
